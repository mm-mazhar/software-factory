name: Process ready issue

on:
  repository_dispatch:
    types: [issue-ready]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Process issue
        env:
          FACTORY_REPO: ${{ github.event.client_payload.repo }}
          FACTORY_ISSUE: ${{ github.event.client_payload.issue }}
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          UPSTASH_BOX_API_KEY: ${{ secrets.UPSTASH_BOX_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node --env-file=.env src/run.mjs "$FACTORY_REPO" "$FACTORY_ISSUE"